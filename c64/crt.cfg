# Banco 0 della cartuccia EasyFlash (src/crt.s): la ROMH, a $E000 nel modo Ultimax dell'accensione.
# Il caricatore si assembla per la RAM dell'EasyFlash ($DF00), la sua fine per la pagina dello stack
# ($0110: il caricatore azzera la pagina zero fino a $0101): l'avvio li copia lì.

MEMORY {
    ROMH:  file = %O, start = $E000, size = $2000, fill = yes, fillval = $FF;
    EFRAM: file = "", start = $DF00, size = $0100;
    STACK: file = "", start = $0110, size = $0070;
}
SEGMENTS {
    BOOT:    load = ROMH, type = ro;
    EFRAM:   load = ROMH, run = EFRAM, type = rw, define = yes;
    TAIL:    load = ROMH, run = STACK, type = rw, define = yes;
    VECTORS: load = ROMH, type = ro, start = $FFFA;
}
