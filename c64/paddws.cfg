# Mappa della memoria della versione C64 per ld65.
#
#   $0002-$00FF  pagina zero (variabili veloci)
#   $0200-$0283  variabili che si vedono anche nel modo Ultimax della cartuccia (src/ef.s): il
#                KERNAL, che le usava, resta spento
#   $0284-$0313  routine sempre in memoria (segmento LOWCODE: mosse speciali, src/supers.s, e la
#                lettura delle tracce dalla cartuccia, src/sid.s): nel .prg dopo il segmento INIT,
#                title_unpack le copia qui all'avvio. Da $0300 i vettori del BASIC, spento; quelli
#                del KERNAL da $0314 restano (un NMI mentre la ROM del KERNAL è accesa li usa)
#   $0334-$03FF  stato delle CPU (dove il KERNAL non scrive: buffer della cassetta)
#   $0400-$07FF  tabelle degli shift del generatore, stato di NEXT e delle scelte (lo schermo
#                di default, che il programma non usa)
#   $F000-$F7FF  tabelle dei quadrati, nella bitmap dell'attract: si rifanno quando strisce,
#                logo e titolo l'hanno coperta (math_step)
#   $FF40-$FFF9  tra la fine della bitmap e i vettori: caratteri della capsula del BULLET e quelli
#                della barra delle mosse speciali, copiati all'avvio dalla cartuccia
#   $0801-$BC9F  programma (stub BASIC, codice, dati), poi spazio libero
#   $BCA0-$BFFF  variabili (BSS); nel .prg c'è al loro posto quello che serve solo all'avvio
#                (segmento INIT: classifica iniziale e copie dalla cartuccia, poi LOWCODE)
#   $C000-$FFFF  banco VIC 3:
#                $C000 schermo, $C400 secondo schermo, $C800 caratteri,
#                $D000 sprite e $D800 titolo dell'attract decompresso (RAM sotto l'I/O: si
#                scrive e si legge con $01 = $34), $E000 bitmap
#   $DF00-$DFFF  RAM della cartuccia EasyFlash (I/O): routine di src/ef.s, che nel .prg stanno
#                a $D000-$D0FF, dopo l'area del VIC (la cartuccia le copia al loro posto)
#   $F800-$FEFF  all'avvio, nella bitmap: le routine che servono solo lì (segmento BOOTCODE, nel
#                .prg da $D100, dopo l'immagine della RAM della cartuccia; la cartuccia non le
#                copia in RAM, unpack.s le prende dalla flash)
#   $C400-$C7FF  in NEXT: il codice delle mosse speciali (segmento SMCODE, src/supers.s), al posto
#                dei colori della bitmap dell'attract. Nel .prg da $D500, dopo le routine
#                dell'avvio: la cartuccia non lo copia in RAM, lo copia la scelta di NEXT (sm_page)
#   $E000-$E3FF  nella classifica: il suo codice (segmento HSCODE,
#                src/challenge.s), nella bitmap dell'attract, che lì non si vede e dopo si rifà.
#                Nel .prg da $D900, dopo le mosse speciali: lo copia la classifica (hs_load)
#   $C400-$C7FF  nel GAME OVER: il suo codice (segmento OVCODE, src/play.s), al posto delle mosse
#                speciali, che la scelta di NEXT e la presentazione di CHALLENGE ricopiano. Nel
#                .prg da $E000 (la prima pagina, poi tre versioni delle altre: segmenti OVA, OVB e
#                OVC, fino a $E9FF), dopo la pagina del set di caratteri con PERFECT (segmento
#                OVCHARS, da $DF00, che ov_enter copia a $CC00): lo copiano enter_over e ov_scene
#   $C400-$C7FF  nel menu: il suo codice (segmento MENUCODE, src/play.s), nel .prg da $EA00: lo
#                copia enter_menu. Nella presentazione di CHALLENGE la sua parte comune (INCODE,
#                src/intro.s, dal .prg da $EE00); l'entrata dell'avversario (INV0-INV6) gira sulle
#                tabelle dei quadrati ($F000, nel .prg da $F200, due pagine per tipo): le copia
#                enter_intro
#   $E000-$FEFF  nel finale di CHALLENGE (src/ending.s, segmenti END*): il suo codice, la canzone
#                e i fuochi; a $C800 il suo set di caratteri. Non nel .prg ma in %O.end (uscita
#                in più di ld65), che tools/make_crt.py mette nei banchi da END_BANK
#
# Il programma gira dalla cartuccia (src/crt.s copia il .prg in RAM), con BASIC e KERNAL spenti
# ($01 = $35). Le tabelle e lo stato (segmenti TABLES e BSS) non sono nel .prg e si preparano
# all'avvio. I caratteri si caricano già al loro posto, gli sprite sul primo schermo, da dove
# l'avvio li copia sotto l'I/O prima di usarlo.

FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__: type = import;
}
MEMORY {
    ZP:       file = "", start = $0002, size = $00FE, define = yes;
    LOADADDR: file = %O, start = %S - 2, size = $0002;
    LOW0:     file = "", start = $0200,  size = $0084;
    LOWRUN:   file = "", start = $0284,  size = $0090;    # LOWCODE (da $0314: vettori del KERNAL)
    LOW1:     file = "", start = $0334,  size = $00CC;
    LOW2:     file = "", start = $0400,  size = $0400;
    HIGH:     file = "", start = $F000,  size = $0800;
    HIGH2:    file = "", start = $FF40,  size = $00BA;
    MAIN:     file = %O, start = %S,     size = $BCA0 - %S, fill = yes;
    INIT:     file = %O, start = $BCA0,  size = $0360, fill = yes;
    VARS:     file = "", start = $BCA0,  size = $0360;    # sopra INIT, dopo l'avvio
    VIC:      file = %O, start = $C000,  size = $1000;
    EFIMG:    file = %O, start = $D000,  size = $0100, fill = yes;
    BOOTIMG:  file = %O, start = $D100,  size = $0400, fill = yes;    # dopo: le routine dell'avvio
    SMIMG:    file = %O, start = $D500,  size = $0400, fill = yes;    # poi le mosse speciali
    HSIMG:    file = %O, start = $D900,  size = $0600, fill = yes;    # e la classifica
    OVCHIMG:  file = %O, start = $DF00,  size = $0100, fill = yes;    # i caratteri di PERFECT
    OVIMG:    file = %O, start = $E000,  size = $0100, fill = yes;    # e il GAME OVER: la prima
    OVAIMG:   file = %O, start = $E100,  size = $0300, fill = yes;    # pagina, poi le tre versioni
    OVBIMG:   file = %O, start = $E400,  size = $0300, fill = yes;    # delle altre (dalla ROML del
    OVCIMG:   file = %O, start = $E700,  size = $0300, fill = yes;    # banco 4 alla ROMH)
    MENUIMG:  file = %O, start = $EA00,  size = $0400, fill = yes;    # poi il menu
    INIMG:    file = %O, start = $EE00,  size = $0400, fill = yes;    # la presentazione di CHALLENGE
    INV0IMG:  file = %O, start = $F200,  size = $0200, fill = yes;
    INV1IMG:  file = %O, start = $F400,  size = $0200, fill = yes;
    INV2IMG:  file = %O, start = $F600,  size = $0200, fill = yes;
    INV3IMG:  file = %O, start = $F800,  size = $0200, fill = yes;
    INV4IMG:  file = %O, start = $FA00,  size = $0200, fill = yes;
    INV5IMG:  file = %O, start = $FC00,  size = $0200, fill = yes;
    INV6IMG:  file = %O, start = $FE00,  size = $0200, fill = yes;
    EFRAM:    file = "", start = $DF00,  size = $0100;
    BOOTRAM:  file = "", start = $F800,  size = $0700;    # routine dell'avvio, nella bitmap
    SMRAM:    file = "", start = $C400,  size = $0400;    # mosse speciali, nel secondo schermo
    HSRAM:    file = "", start = $E000,  size = $0600;    # classifica, nella bitmap
    OVRAM:    file = "", start = $C400,  size = $0100;    # GAME OVER, nel secondo schermo
    OVARAM:   file = "", start = $C500,  size = $0300;    # le tre versioni, dopo la prima
    OVBRAM:   file = "", start = $C500,  size = $0300;    # pagina
    OVCRAM:   file = "", start = $C500,  size = $0300;
    MENURAM:  file = "", start = $C400,  size = $0400;    # menu, nel secondo schermo
    INRAM:    file = "", start = $C400,  size = $0400;    # presentazione: parte comune
    INV0RAM:  file = "", start = $F000,  size = $0200;
    INV1RAM:  file = "", start = $F000,  size = $0200;
    INV2RAM:  file = "", start = $F000,  size = $0200;
    INV3RAM:  file = "", start = $F000,  size = $0200;
    INV4RAM:  file = "", start = $F000,  size = $0200;
    INV5RAM:  file = "", start = $F000,  size = $0200;
    INV6RAM:  file = "", start = $F000,  size = $0200;
    # finale di CHALLENGE (src/ending.s): nel file %O.end, in quest'ordine (tools/make_crt.py lo
    # mette nei banchi da END_BANK); gira dove sta, il finale lo copia dalla cartuccia
    ENDA:     file = "%O.end", start = $E000, size = $0B00, fill = yes;
    ENDB:     file = "%O.end", start = $EC00, size = $0400, fill = yes;
    ENDC:     file = "%O.end", start = $FB00, size = $0400, fill = yes;
    ENDCH:    file = "%O.end", start = $C800, size = $0800, fill = yes;
    ENDD:     file = "%O.end", start = $EB00, size = $0100, fill = yes;
    ENDE:     file = "%O.end", start = $F000, size = $0B00, fill = yes;
    # poi, nello stesso file (offset $2700, INI_OFF di src/challenge.s), le iniziali della
    # classifica, che girano nel secondo schermo
    ENDF:     file = "%O.end", start = $C400, size = $0400, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro,  optional = yes;
    DATA:     load = MAIN,     type = rw,  optional = yes;
    TABLES:   load = HIGH,     type = bss, align = $100;
    HIBSS:    load = HIGH2,    type = bss;
    INIT:     load = INIT,     type = ro;
    LOWCODE:  load = INIT,     run = LOWRUN,  type = rw, define = yes;
    BSS:      load = VARS,     type = bss, optional = yes, define = yes;
    LOWBSS:   load = LOW0,     type = bss;
    CPUBSS:   load = LOW1,     type = bss;
    TABLES2:  load = LOW2,     type = bss, align = $100;
    NEXTBSS:  load = LOW2,     type = bss;
    SPRDATA:  load = VIC,      type = ro,  start = $C000;
    CHARSET:  load = VIC,      type = ro,  start = $C800;
    EFCODE:   load = EFIMG,    run = EFRAM, type = rw, define = yes;
    BOOTCODE: load = BOOTIMG,  run = BOOTRAM, type = rw, define = yes;
    SMCODE:   load = SMIMG,    run = SMRAM,   type = rw, define = yes;
    HSCODE:   load = HSIMG,    run = HSRAM,   type = rw, define = yes;
    OVCODE:   load = OVIMG,    run = OVRAM,   type = rw, define = yes;
    OVA:      load = OVAIMG,   run = OVARAM,  type = rw, define = yes;
    OVB:      load = OVBIMG,   run = OVBRAM,  type = rw, define = yes;
    OVC:      load = OVCIMG,   run = OVCRAM,  type = rw, define = yes;
    MENUCODE: load = MENUIMG,  run = MENURAM, type = rw, define = yes;
    INCODE:   load = INIMG,    run = INRAM,   type = rw, define = yes;
    INV0:     load = INV0IMG,  run = INV0RAM,  type = rw, define = yes;
    INV1:     load = INV1IMG,  run = INV1RAM,  type = rw, define = yes;
    INV2:     load = INV2IMG,  run = INV2RAM,  type = rw, define = yes;
    INV3:     load = INV3IMG,  run = INV3RAM,  type = rw, define = yes;
    INV4:     load = INV4IMG,  run = INV4RAM,  type = rw, define = yes;
    INV5:     load = INV5IMG,  run = INV5RAM,  type = rw, define = yes;
    INV6:     load = INV6IMG,  run = INV6RAM,  type = rw, define = yes;
    OVCHARS:  load = OVCHIMG,  type = ro, define = yes;
    ENDA:     load = ENDA,     type = rw;
    ENDB:     load = ENDB,     type = rw;
    ENDC:     load = ENDC,     type = rw;
    ENDCH:    load = ENDCH,    type = rw;
    ENDD:     load = ENDD,     type = rw;
    ENDE:     load = ENDE,     type = rw;
    INICODE:  load = ENDF,     type = rw, define = yes;
}
