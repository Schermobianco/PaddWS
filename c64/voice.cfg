# File voce di CHALLENGE (src/voice.s): campioni, tema e (nel file del primo livello) player,
# READY e GO, caricati a VOICE_BASE (src/voice.inc) dal disco o copiati dalla cartuccia.

MEMORY {
    LOADADDR: file = %O, start = $DFFE, size = $0002;
    MAIN:     file = %O, start = $E000, size = $1000;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    CODE:     load = MAIN,     type = rw;
}
