# Deck: moduli del Raspberry che il gioco non usa (video, codec, camera); caricarli costa tempo
blacklist bcm2835_codec
blacklist bcm2835_isp
blacklist bcm2835_v4l2
blacklist bcm2835_mmal_vchiq
blacklist rpi_hevc_dec
blacklist vc_sm_cma
blacklist i2c_dev
blacklist bluetooth
blacklist hci_uart
blacklist btbcm
# l'USB (WiFi, Ethernet) non serve al gioco: dwc2 lo carica paddws-net, dopo il gioco
blacklist dwc2
