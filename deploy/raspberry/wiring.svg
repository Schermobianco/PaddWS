<text x="500.0" y="816" text-anchor="middle" fill="#333" font-size="12">Encoder: modulo KY-040 o encoder nudo (CLK e DT ai due capi, il comune a GND); pull-up interni attivati dal gioco.</text>
<text x="500.0" y="832" text-anchor="middle" fill="#333" font-size="12">Il + del KY-040 va al 3V3, mai al 5V: i GPIO del Raspberry reggono solo 3,3 V.</text>
<text x="500.0" y="848" text-anchor="middle" fill="#333" font-size="12">Pulsanti: un capo sul GPIO, l'altro a GND. Pin configurabili nella sezione encoder di padd_config.json.</text>
