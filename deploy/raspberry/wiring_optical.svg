<text x="500.0" y="840" text-anchor="middle" fill="#333" font-size="12">Solo encoder con uscite NPN open collector (es. LPD3806-360BM-G5-24C, -600BM-G5-24C), alimentati a 5 V:</text>
<text x="500.0" y="856" text-anchor="middle" fill="#333" font-size="12">A e B portano il GPIO a massa e il pull-up interno lo riporta a 3,3 V. Mai uscite push-pull a 5 V su un GPIO.</text>
<text x="500.0" y="872" text-anchor="middle" fill="#333" font-size="12">Cavi lunghi o giri molto veloci: pull-up esterni da 2,2 kOhm da A e B verso 3V3 (pin 1 o 17); la calza a GND.</text>
<text x="500.0" y="888" text-anchor="middle" fill="#333" font-size="12">padd_config.json, sezione encoder: pulses_per_revolution 360 o 600, debounce_us 0, turns_per_travel a piacere.</text>
