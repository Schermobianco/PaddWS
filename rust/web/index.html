<!doctype html>
<!-- Versione web di PADD WS: pagina che carica paddws.wasm con il JavaScript di macroquad.
     Per telefoni e tablet (Android e iOS): niente zoom né scorrimento, il gioco resta dentro
     le aree sicure dello schermo (notch), schermo intero da "Aggiungi a Home" (manifest).
     L'audio parte al primo tocco: lo sblocca audio.js di macroquad, come chiede Safari.
     La musica del SID la suona il gioco in tempo reale: sid_audio.js. I gamepad li legge
     gamepad.js; preferenze e classifica restano nel localStorage: storage.js. -->
<html lang="it">
<head>
<meta charset="utf-8">
<title>PADD WS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="PADD WS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-64.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
    }
    /* la tela evita notch e barra dei gesti; il gioco mette le bande nere al suo interno */
    canvas {
        position: fixed;
        top: env(safe-area-inset-top);
        left: env(safe-area-inset-left);
        width: calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right));
        height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        touch-action: none;
        outline: none;
        display: block;
    }
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="1"></canvas>
<script src="mq_js_bundle.js"></script>
<script src="sid_audio.js"></script>
<script src="gamepad.js"></script>
<script src="storage.js"></script>
<script>
    load("paddws.wasm");
    document.getElementById("glcanvas").focus();
    // niente menu del tasto destro né pressione lunga sulla tela
    document.addEventListener("contextmenu", (e) => e.preventDefault());
    // mouse come spinner: il tasto centrale usa il bonus, non fa scorrere la pagina
    document.addEventListener("mousedown", (e) => { if (e.button === 1) e.preventDefault(); });
</script>
</body>
</html>
