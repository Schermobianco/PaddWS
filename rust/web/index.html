<!doctype html>
<!-- Versione web di PADD WS: pagina che carica paddws.wasm con il JavaScript di macroquad.
     Per telefoni e tablet (Android e iOS): niente zoom né scorrimento, il gioco resta dentro
     le aree sicure dello schermo (notch), schermo intero da "Aggiungi a Home" (manifest).
     L'audio parte al primo tocco: lo sblocca audio.js di macroquad, come chiede Safari; senza
     audio si gioca muti. Gli errori compaiono in un riquadro rosso in basso.
     La musica del SID la suona il gioco in tempo reale: sid_audio.js. I gamepad li legge
     gamepad.js; preferenze e classifica restano nel localStorage: storage.js. Sui
     dispositivi touch il primo tocco porta a schermo intero e lo schermo resta acceso: fullscreen.js. -->
<html lang="it">
<head>
<meta charset="utf-8">
<title>PADD WS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="PADD WS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-64.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
    }
    /* la tela evita notch e barra dei gesti; il gioco mette le bande nere al suo interno */
    canvas {
        position: fixed;
        top: env(safe-area-inset-top);
        left: env(safe-area-inset-left);
        width: calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right));
        height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        touch-action: none;
        outline: none;
        display: block;
    }
    /* errori sullo schermo: su iPhone e iPad la console non si vede senza un Mac */
    #errors {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1;
        max-height: 50%;
        overflow: auto;
        margin: 0;
        padding: 8px;
        background: #400;
        color: #fcc;
        font: 12px monospace;
        white-space: pre-wrap;
    }
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="1"></canvas>
<pre id="errors" hidden></pre>
<script>
    // errori e panic del gioco (console.error) nel riquadro in basso; un tocco lo chiude
    (function () {
        const box = document.getElementById("errors");
        function show(msg) {
            box.hidden = false;
            box.textContent += msg + "\n";
        }
        box.addEventListener("click", () => { box.hidden = true; box.textContent = ""; });
        const error = console.error;
        console.error = function (...args) {
            const msg = args.map(String).join(" ");
            // innocuo: l'atlante dei caratteri di macroquad cresce (nuova dimensione dello schermo)
            // e per un frame le scritte già disegnate puntano alla texture vecchia; resta in console
            if (!msg.includes("called with an already deleted texture")) {
                show(msg);
            }
            error.apply(console, args);
        };
        window.addEventListener("error", (e) => show(e.message || String(e.error)));
        window.addEventListener("unhandledrejection", (e) => show("promise: " + e.reason));
        if (typeof WebAssembly === "undefined") {
            show("WebAssembly non disponibile in questo browser (su iPhone e iPad: modalità di isolamento?)");
        }
    })();
</script>
<script src="mq_js_bundle.js"></script>
<script src="sid_audio.js"></script>
<script src="gamepad.js"></script>
<script src="storage.js"></script>
<script src="fullscreen.js"></script>
<script>
    load("paddws.wasm");
    document.getElementById("glcanvas").focus();
    // niente menu del tasto destro né pressione lunga sulla tela
    document.addEventListener("contextmenu", (e) => e.preventDefault());
    // mouse come spinner: il tasto centrale usa il bonus, non fa scorrere la pagina
    document.addEventListener("mousedown", (e) => { if (e.button === 1) e.preventDefault(); });
</script>
</body>
</html>
